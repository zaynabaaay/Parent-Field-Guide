<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guide Cover Mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="light-sweep"></div>

    <svg class="leaf" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 220 C 95 160 70 120 30 80 C 70 90 100 120 110 160 C 115 110 95 60 50 20 C 100 30 130 70 130 130 C 140 90 130 50 110 10 C 150 30 160 80 140 140 C 138 170 120 200 100 220 Z" fill="#5c6e4f"/>
      <path d="M100 220 C 95 160 70 120 30 80" stroke="#46563b" stroke-width="2" fill="none"/>
      <path d="M100 220 C 95 110 95 60 50 20" stroke="#46563b" stroke-width="2" fill="none"/>
      <path d="M100 220 C 130 150 150 90 140 140" stroke="#46563b" stroke-width="2" fill="none"/>
    </svg>

    <div class="rattan"></div>

    <div class="books">
      <div class="book book-left">
        <div class="cover" style="--cover: none;"></div>
        <div class="spine-highlight"></div>
      </div>
      <div class="book book-center">
        <div class="cover" style="--cover: none;"></div>
        <div class="spine-highlight"></div>
      </div>
      <div class="book book-right">
        <div class="cover" style="--cover: none;"></div>
        <div class="spine-highlight"></div>
      </div>
    </div>

    <div class="fabric"></div>

    <svg class="toy-car" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="30" width="100" height="22" rx="6" fill="#c9985f"/>
      <rect x="30" y="14" width="45" height="20" rx="6" fill="#c9985f"/>
      <rect x="34" y="18" width="16" height="12" rx="2" fill="#7a5230"/>
      <rect x="52" y="18" width="16" height="12" rx="2" fill="#7a5230"/>
      <circle cx="32" cy="54" r="11" fill="#5c4326"/>
      <circle cx="32" cy="54" r="4" fill="#d9c8a9"/>
      <circle cx="88" cy="54" r="11" fill="#5c4326"/>
      <circle cx="88" cy="54" r="4" fill="#d9c8a9"/>
    </svg>
  </div>
</body>
</html>
